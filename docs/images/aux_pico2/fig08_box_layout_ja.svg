<text x="30" y="854" font-size="14" fill="#222" text-anchor="start" font-weight="700">2分岐: Grove の線 1 本に、ジャンパー線 2 本を半田付けし、つなぎ目に熱収縮チューブをかぶせます（製作説明書を見てください）。</text>
<text x="30" y="876" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="400">基板の POWER の GND と I²S OUT の GND は、基板の中でつながっているので、I²S の GND のピンは空けておけます。</text>
<text x="30" y="900" font-size="14" fill="#222" text-anchor="start" font-weight="400">線は、ピンに直接挿します。R1、R2 は 330Ω の抵抗です。</text>
<text x="30" y="922" font-size="14" fill="#222" text-anchor="start" font-weight="400">Grove の赤と黒は、それぞれ2本に分けます。青: Pico の AGND（33番）と、基板の CN3 の GND（真ん中のピン）。</text>
<text x="30" y="944" font-size="13" fill="#555" text-anchor="start" font-weight="400">線の色は、Cardputer のポートの札の色（G1 は灰、G2 は黄）に合わせています。ケーブルによって違い、作者のケーブルは、G1 が黄、G2 が白です。</text>
</svg>
