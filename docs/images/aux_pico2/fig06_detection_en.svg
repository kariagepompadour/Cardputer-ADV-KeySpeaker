<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="Start-up detection">
<title>Start-up detection</title>
<rect width="1040" height="620" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#222" text-anchor="start" font-weight="700">Figure 6  Finding what is on the Grove port</text>
<text x="24" y="60" font-size="14" fill="#666" text-anchor="start">KeySpeaker's logic. When neither answers, it repeats once a second</text>
<rect x="60" y="100" width="300" height="60" rx="6" fill="#f4f5f7" stroke="#222" stroke-width="1.5"/>
<text x="210.0" y="135.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Read I²C address 0x40</text>
<line x1="210" y1="160" x2="210" y2="215" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="210.0,215.0 205.2,205.1 214.8,205.1" fill="#222"/>
<text x="222" y="192" font-size="13" fill="#666" text-anchor="start">no answer</text>
<line x1="360" y1="130" x2="560" y2="130" stroke="#00897b" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="560.0,130.0 550.1,134.8 550.1,125.2" fill="#00897b"/>
<text x="460" y="120" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700">answers</text>
<rect x="560" y="100" width="420" height="60" rx="6" fill="#e0f2ef" stroke="#222" stroke-width="1.5"/>
<text x="770.0" y="124.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Use it as a direct dial</text>
<text x="770.0" y="146.0" font-size="12.5" fill="#666" text-anchor="middle">as today</text>
<rect x="60" y="215" width="300" height="60" rx="6" fill="#f4f5f7" stroke="#222" stroke-width="1.5"/>
<text x="210.0" y="250.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Stop I²C, open the UART</text>
<line x1="210" y1="275" x2="210" y2="330" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="210.0,330.0 205.2,320.1 214.8,320.1" fill="#222"/>
<rect x="60" y="330" width="300" height="60" rx="6" fill="#f4f5f7" stroke="#222" stroke-width="1.5"/>
<text x="210.0" y="365.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Send HELLO, wait 100 ms</text>
<line x1="360" y1="360" x2="560" y2="360" stroke="#8e44ad" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="560.0,360.0 550.1,364.8 550.1,355.2" fill="#8e44ad"/>
<text x="460" y="350" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">answers</text>
<rect x="560" y="330" width="420" height="60" rx="6" fill="#f3e8f8" stroke="#222" stroke-width="1.5"/>
<text x="770.0" y="354.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Use the Pico 2 AUX unit</text>
<text x="770.0" y="376.0" font-size="12.5" fill="#666" text-anchor="middle">Fn+I offers AUX. Dial values arrive too</text>
<line x1="210" y1="390" x2="210" y2="445" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="210.0,445.0 205.2,435.1 214.8,435.1" fill="#222"/>
<text x="222" y="422" font-size="13" fill="#666" text-anchor="start">no answer</text>
<rect x="60" y="445" width="300" height="60" rx="6" fill="#f4f5f7" stroke="#222" stroke-width="1.5"/>
<text x="210.0" y="480.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">Close the UART, back to I²C</text>
<path d="M60 475 L30 475 L30 130 L60 130" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="560" font-size="13" fill="#666" text-anchor="start">again after a second</text>
<line x1="30" y1="475" x2="30" y2="545" stroke="#666" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<rect x="560" y="445" width="420" height="60" rx="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="770.0" y="469.0" font-size="14.5" fill="#222" text-anchor="middle" font-weight="700">The Pico keeps TX off until it is asked</text>
<text x="770.0" y="491.0" font-size="12.5" fill="#666" text-anchor="middle">and stops 500 ms after the last command</text>
<line x1="770" y1="390" x2="770" y2="445" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>
