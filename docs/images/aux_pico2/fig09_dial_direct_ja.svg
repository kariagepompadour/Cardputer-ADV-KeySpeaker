<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 630" width="1100" height="630" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Noto Sans JP','Yu Gothic',Meiryo,sans-serif" role="img" aria-label="図9　ジョグダイヤルをPicoに直接つなぐ（ブレッドボードなし）">
<title>図9　ジョグダイヤルをPicoに直接つなぐ（ブレッドボードなし）</title><rect width="1100" height="630" fill="#ffffff"/>
<text x="24" y="36" font-size="22" fill="#222" font-weight="700">図9　ジョグダイヤルをPicoに直接つなぐ（ブレッドボードなし）</text>
<rect x="886" y="16" width="190" height="28" rx="4" fill="#fdecea" stroke="#d62728" stroke-width="2"/>
<text x="981" y="36" font-size="16" fill="#d62728" text-anchor="middle" font-weight="700">実機では未検証</text>
<text x="24" y="60" font-size="14" fill="#666">Pico 2 Hのピンに、ダイヤルのGroveケーブルと10kΩ 2本を、線でつなぎます。ブレッドボードの穴の名前は使いません</text>
<rect x="40" y="90" width="300" height="370" rx="6" fill="#e9f6ec" stroke="#222" stroke-width="1.5"/>
<text x="190" y="118" font-size="17" fill="#222" text-anchor="middle" font-weight="700">Pico 2 H</text>
<rect x="760" y="90" width="300" height="370" rx="6" fill="#fff" stroke="#00897b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="910" y="118" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700">ジョグダイヤルのGroveケーブル</text>
<text x="910" y="138" font-size="13" fill="#00897b" text-anchor="middle">（Unit Encoder U135）</text>
<text x="326" y="195" font-size="14" fill="#222" text-anchor="end" font-weight="700">9番  GP6（SDA）</text>
<circle cx="340" cy="190" r="6" fill="#c9a400" stroke="#222" stroke-width="1.5"/>
<text x="326" y="260" font-size="14" fill="#222" text-anchor="end" font-weight="700">36番  3V3(OUT)</text>
<circle cx="340" cy="255" r="6" fill="#e67e22" stroke="#222" stroke-width="1.5"/>
<text x="326" y="325" font-size="14" fill="#222" text-anchor="end" font-weight="700">10番  GP7（SCL）</text>
<circle cx="340" cy="320" r="6" fill="#7f7f7f" stroke="#222" stroke-width="1.5"/>
<text x="326" y="395" font-size="14" fill="#222" text-anchor="end" font-weight="700">38番  GND</text>
<circle cx="340" cy="390" r="6" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="326" y="445" font-size="14" fill="#222" text-anchor="end" font-weight="700">39番  VSYS</text>
<circle cx="340" cy="440" r="6" fill="#d62728" stroke="#222" stroke-width="1.5"/>
<text x="774" y="195" font-size="14" fill="#222" font-weight="700">黄  SDA</text>
<circle cx="760" cy="190" r="6" fill="#c9a400" stroke="#222" stroke-width="1.5"/>
<text x="774" y="325" font-size="14" fill="#222" font-weight="700">白  SCL</text>
<circle cx="760" cy="320" r="6" fill="#9e9e9e" stroke="#222" stroke-width="1.5"/>
<text x="774" y="395" font-size="14" fill="#222" font-weight="700">黒  GND</text>
<circle cx="760" cy="390" r="6" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="774" y="445" font-size="14" fill="#222" font-weight="700">赤  5V</text>
<circle cx="760" cy="440" r="6" fill="#d62728" stroke="#222" stroke-width="1.5"/>
<line x1="346" y1="190" x2="754" y2="190" stroke="#c9a400" stroke-width="3" stroke-linecap="round"/>
<line x1="346" y1="320" x2="754" y2="320" stroke="#9e9e9e" stroke-width="3" stroke-linecap="round"/>
<line x1="346" y1="390" x2="754" y2="390" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="346" y1="440" x2="754" y2="440" stroke="#d62728" stroke-width="3" stroke-linecap="round"/>
<line x1="346" y1="255" x2="540" y2="255" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
<line x1="540" y1="255" x2="540" y2="190" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
<rect x="526" y="212" width="28" height="21" fill="#fff" stroke="#e67e22" stroke-width="2.5"/>
<text x="562" y="227" font-size="13" fill="#e67e22" font-weight="700">R3 10kΩ</text>
<line x1="540" y1="255" x2="540" y2="320" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
<rect x="526" y="277" width="28" height="21" fill="#fff" stroke="#e67e22" stroke-width="2.5"/>
<text x="562" y="292" font-size="13" fill="#e67e22" font-weight="700">R4 10kΩ</text>
<circle cx="540" cy="190" r="4.5" fill="#c9a400"/>
<circle cx="540" cy="320" r="4.5" fill="#9e9e9e"/>
<circle cx="540" cy="255" r="4.5" fill="#e67e22"/>
<line x1="24" y1="486" x2="1076" y2="486" stroke="#ddd"/>
<text x="24" y="510" font-size="13" fill="#333">・10kΩは2本とも、片方の足を3V3(36番)側にまとめ、もう片方を黄（SDA）と白（SCL）につなぎます。</text>
<text x="24" y="534" font-size="13" fill="#333">・線の色はケーブルによって違うことがあります。黄と白は入れ違えても壊れません。動かなければ入れ替えます。</text>
<text x="24" y="558" font-size="13" fill="#333">・赤と黒は、箱の中のGroveの赤い分岐（VSYS）と黒い分岐（GND）に足してもかまいません。</text>
<text x="24" y="582" font-size="13" fill="#333">・試すとき：Pico とCardputerをつなぐGroveはCardputer側から抜き、PicoだけUSBでパソコンにつなぎます。</text>
<text x="24" y="606" font-size="13" fill="#333">・シリアルモニタの `ST>` の行が `dial=1` になれば、Picoがダイヤルを見つけています。</text>
</svg>